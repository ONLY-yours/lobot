name: Auto Release

# ============================================
# main 上有面向用户的改动时自动发一个 patch 版本（+0.0.1）
# ============================================
# CI 在 main 上跑通后：若上一个 v* tag 之后有 feat / fix / style / perf 提交
# （规则见 scripts/electronWorkflow/planAutoRelease.sh），就给这次 CI 验过的
# 提交打 vX.Y.Z tag，再以该 tag 触发 Release Desktop 构建并发布 stable。
#
# - 只发 CI 通过的提交；被后续 push 取消的 CI 不发，它的改动会随下一次发出
# - head 提交的标题（首行）写 [skip release] 可跳过本次
# - 用 GITHUB_TOKEN 推的 tag 不会再触发 Release Desktop 的 tag push，
#   所以这里显式 dispatch，避免重复构建
# ============================================

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  # push the tag
  contents: write
  # dispatch Release Desktop
  actions: write

# One at a time, so two runs never claim the same version.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and dispatch
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history and tags: the plan reads the commits since the last tag.
          fetch-depth: 0

      - name: Plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/electronWorkflow/planAutoRelease.sh "${{ github.event.workflow_run.head_sha }}" | tee -a "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.plan.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          git tag "$TAG" "${{ github.event.workflow_run.head_sha }}"
          git push origin "refs/tags/${TAG}"

      - name: Dispatch Release Desktop
        if: steps.plan.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Run on the tag so the build checks out exactly the commit CI passed.
          gh workflow run release-desktop.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.plan.outputs.tag }}" \
            -f version="${{ steps.plan.outputs.version }}" \
            -f channel=stable \
            -f draft=false
          echo "🚀 Dispatched Lobot ${{ steps.plan.outputs.version }} (${{ steps.plan.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"
