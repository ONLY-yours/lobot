name: Release Desktop

# ============================================
# Lobot 桌面端发布
# ============================================
# 用本仓源码构建三端安装包，发到本仓 Release，并同步到 S3 更新源。
#
# 可选配置（缺失时对应步骤降级而不失败）：
#   - APPLE_*：macOS 签名与公证，缺失则产物未签名
#   - UPDATE_SERVER_URL：客户端检查更新的地址
#   - UPDATE_AWS_* / UPDATE_S3_*：S3 更新源，缺失则跳过同步
# ============================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options: [stable, beta, canary]
        default: stable
      draft:
        description: '发布为 draft release（gh 对 draft 的 tag 绑定不稳定，默认直接发布）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  npm_config_registry: https://registry.npmjs.org

jobs:
  # ---------- 1. 解析版本 ----------
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
    steps:
      - name: Resolve
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          CHANNEL="${{ inputs.channel }}"
          if [ -z "$CHANNEL" ]; then CHANNEL="stable"; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Building Lobot ${VERSION} (${CHANNEL})"

  # ---------- 2. 构建 ----------
  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            platform: mac
            arch: arm64
            artifact: mac-arm64
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
            artifact: win-x64
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from package.json `packageManager`.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # apps/cli builds with bun (ensureWorkspaceLinks + tsdown).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: pnpm install

      - name: Set version
        shell: bash
        run: npm run workflow:set-desktop-version ${{ needs.prepare.outputs.version }} ${{ needs.prepare.outputs.channel }}

      - name: Build app bundle
        shell: bash
        env:
          # vite.main.config.ts 把这两个值编译进主进程；缺失时客户端不知道去哪检查更新。
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
        run: pnpm build:main

      - name: Package
        shell: bash
        env:
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          # 用 APP_UPDATE_SERVER_URL 而不是 UPDATE_SERVER_URL：前者只让 afterPack 改写
          # app-update.yml 指向 S3，后者会把 provider 变成 generic 从而不再生成 latest*.yml。
          APP_UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          # electron-builder.mjs 以 CSC_LINK 是否存在决定是否签名；
          # 证书缺失时构建仍可完成，只是产物未签名。
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            mac)
              if [ -n "${CSC_LINK:-}" ]; then
                echo "🔐 使用 Developer ID 证书签名并公证"
                npx electron-builder --mac --${{ matrix.arch }} --config electron-builder.mjs \
                  --publish never -c.npmRebuild=false
              else
                echo "::warning::未配置 APPLE_CERTIFICATE_BASE64，产物未签名、未公证"
                npx electron-builder --mac --${{ matrix.arch }} --config electron-builder.mjs \
                  --publish never -c.npmRebuild=false -c.mac.identity=null -c.mac.notarize=false
              fi
              ;;

            win)
              npx electron-builder --win --${{ matrix.arch }} --config electron-builder.mjs --publish never -c.npmRebuild=false
              ;;
            linux)
              npx electron-builder --linux --${{ matrix.arch }} --config electron-builder.mjs --publish never -c.npmRebuild=false
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  # ---------- 3. 发布到本仓（公开）----------
  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      # gh release resolves the target repo from the git remote.
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create / update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Resolve from job outputs, then the dispatch input, then the tag ref.
          VERSION="${{ needs.prepare.outputs.version }}"
          [ -n "$VERSION" ] || VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME#v}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          DRAFT="${{ inputs.draft }}"
          DRAFT_FLAG=""
          if [ "$DRAFT" = "true" ] || [ -z "$DRAFT" ]; then DRAFT_FLAG="--draft"; fi

          echo "Publishing ${TAG} to ${REPO}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，追加产物"
          else
            # A draft release created for a missing tag becomes "untagged", and
            # GitHub refuses asset uploads to untagged releases. Create the tag
            # first so the draft is bound to it.
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "$TAG" || true

            gh release create "$TAG" \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "Lobot ${VERSION}" \
              --notes "Lobot ${VERSION} (${{ needs.prepare.outputs.channel }})" \
              $DRAFT_FLAG
          fi

          # Uploads can 404 for a few seconds right after the release is created
          # (read-after-write lag), so retry each asset a few times.
          while IFS= read -r -d '' file; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" --repo "$REPO" --clobber; then
                break
              fi
              echo "上传失败 (第 ${attempt} 次): ${file}"
              sleep 6
              [ "$attempt" = 5 ] && { echo "::error::上传失败: ${file}"; exit 1; }
            done
          done < <(find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name 'latest*.yml' \) -print0)

      # 客户端按 UPDATE_SERVER_URL 从 S3 检查更新；GitHub Release 作为备份。
      - name: Sync artifacts to S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.UPDATE_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.UPDATE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.UPDATE_S3_REGION || 'us-east-1' }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${S3_BUCKET:-}" ]; then
            echo "::warning::UPDATE_S3_BUCKET 未配置，跳过 S3 同步"
            exit 0
          fi

          AWS_ARGS=(--region "$S3_REGION")
          if [ -n "${S3_ENDPOINT:-}" ]; then AWS_ARGS+=(--endpoint-url "$S3_ENDPOINT"); fi

          # 客户端只认 stable / canary（beta 并入 canary，见 modules/updater/configs.ts）。
          case "$CHANNEL" in
            canary | beta) FEED_CHANNEL=canary ;;
            *) FEED_CHANNEL=stable ;;
          esac

          upload() {
            aws s3 cp "$1" "s3://${S3_BUCKET}/${FEED_CHANNEL}/$2" "${AWS_ARGS[@]}" \
              --cache-control 'public, max-age=300'
            echo "⬆️  ${FEED_CHANNEL}/$2"
            count=$((count + 1))
          }

          count=0
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            upload "$file" "$name"
            # electron-updater 设置 channel 后读取 {channel}*.yml（如 stable-mac.yml），
            # 而 GitHub provider 生成的是 latest*.yml，两份都传。
            case "$name" in
              latest*.yml) upload "$file" "${FEED_CHANNEL}${name#latest}" ;;
            esac
          done < <(find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name 'latest*.yml' \) -print0)

          echo "✅ 已同步 ${count} 个文件到 s3://${S3_BUCKET}/${FEED_CHANNEL}/"
