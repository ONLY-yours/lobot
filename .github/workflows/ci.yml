name: CI

# A bundle build is the check this repository can pass today and the one that
# catches a broken app before release. Lint, type-check and unit tests join once
# the existing errors and the missing test setup are fixed.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**', '.claude/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**', '.claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from package.json `packageManager`.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build:main
